<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Segurança: só arquivos deste site (nada de script embutido ou de fora). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#0f1115">
<title>Ferro — plano de força</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <p class="marca"><img src="icone.svg" alt="" width="22" height="22"> Ferro</p>
  <h1 id="titulo">Treino</h1>
  <p class="sub" id="subtitulo"></p>
  <nav class="abas" role="tablist" aria-label="Partes">
    <button type="button" role="tab" data-aba="treino" aria-selected="true">Treino</button>
    <button type="button" role="tab" data-aba="historico" aria-selected="false">Histórico</button>
    <button type="button" role="tab" data-aba="dados" aria-selected="false">Dados</button>
  </nav>
</header>

<main>
  <section id="treino" class="aba ativa" role="tabpanel">
    <div id="cartoes"></div>
    <button type="button" class="botao principal" id="encerrar">Encerrar sessão</button>
    <button type="button" class="botao pequeno" id="trocar"></button>
  </section>

  <section id="historico" class="aba" role="tabpanel"></section>

  <section id="dados" class="aba" role="tabpanel">
    <div class="cartao">
      <h2>Tela acesa</h2>
      <label class="marcar"><input type="checkbox" id="telaAcesa"> Manter a tela acesa durante o treino</label>
    </div>
    <div class="cartao">
      <h2>Cópia de segurança</h2>
      <p class="nota">Copie e guarde. Limpar os dados do navegador apaga tudo.</p>
      <label class="oculto" for="json">Cópia de segurança (JSON)</label>
      <textarea id="json" readonly></textarea>
      <button type="button" class="botao" id="copiar">Copiar</button>
    </div>
    <div class="cartao">
      <h2>Importar</h2>
      <p class="nota">Cole uma cópia feita aqui e confirme. Substitui o que está agora.</p>
      <label class="oculto" for="importar">Cópia para importar</label>
      <textarea id="importar" placeholder='{"loads":{...},"log":[...]}'></textarea>
      <button type="button" class="botao" id="botaoImportar">Importar</button>
    </div>
    <button type="button" class="botao perigo" id="zerar">Zerar histórico e cargas</button>
  </section>
</main>

<!-- Cronômetro: descanso (conta para trás) e prancha (conta para frente). -->
<div id="doca" aria-label="Cronômetro">
  <div class="linha-relogio">
    <div>
      <div id="relogio" aria-live="off">3:00</div>
      <div id="rotulo">descanso</div>
    </div>
    <button type="button" class="ir" id="iniciar">Iniciar</button>
    <button type="button" id="zerarTempo" aria-label="Zerar o cronômetro">Zerar</button>
  </div>
  <div class="escolha" role="group" aria-label="Tempo">
    <button type="button" data-tempo="90">1:30</button>
    <button type="button" data-tempo="120">2:00</button>
    <button type="button" data-tempo="180" class="ligado">3:00</button>
    <button type="button" data-tempo="prancha">Prancha</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
