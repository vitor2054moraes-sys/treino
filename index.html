<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Plano de Força</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0f1115; --card:#181c23; --card2:#1f242d; --line:#2b313c;
  --tx:#e8ecf2; --tx2:#98a2b3; --ac:#4f8cff; --ok:#2fbf71; --wr:#e8a33d; --bad:#e5484d;
  --r:14px; --sp:12px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 120px;background:var(--bg);color:var(--tx);
  font:400 1rem/1.45 system-ui,-apple-system,Roboto,sans-serif}

/* ============ LAYOUT ============ */
header{position:sticky;top:0;z-index:20;background:#0f1115ee;backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 16px 0}
h1{margin:0;font-size:1.05rem;letter-spacing:.02em}
.sub{color:var(--tx2);font-size:.82rem;margin:2px 0 12px}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--tx2);padding:10px 0;font:600 .85rem system-ui;cursor:pointer}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{padding:16px}
section{display:none} section.on{display:block}

/* ============ CARDS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:var(--sp)}
.card h3{margin:0 0 2px;font-size:.98rem}
.load{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.load small{font-size:.8rem;font-weight:500;color:var(--tx2)}
.meta{color:var(--tx2);font-size:.8rem;margin:6px 0}
.plates{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:.82rem;margin:8px 0}
.warm{color:var(--tx2);font-size:.78rem;line-height:1.7}
.reps{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.reps label{flex:1;min-width:64px;font-size:.7rem;color:var(--tx2)}
.reps input{width:100%;margin-top:3px;background:var(--card2);border:1px solid var(--line);
  color:var(--tx);border-radius:9px;padding:11px;font-size:1.05rem;text-align:center}
.reps input:focus{outline:none;border-color:var(--ac)}

/* ============ BOTÕES ============ */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;
  font:700 .95rem system-ui;cursor:pointer;margin-bottom:8px;background:var(--card2);color:var(--tx)}
.btn.pri{background:var(--ac);color:#fff}
.btn.dan{background:#3a1f22;color:var(--bad)}
.btn.sm{padding:10px;font-size:.82rem}
.row{display:flex;gap:8px} .row>*{flex:1;margin-bottom:8px}

/* ============ HISTÓRICO ============ */
.log{border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px}
.log b{font-size:.9rem} .log .d{color:var(--tx2);font-size:.75rem}
.log ul{margin:6px 0;padding-left:16px;font-size:.8rem;color:var(--tx2)}
.msg{font-size:.8rem;margin:2px 0}
.ok{color:var(--ok)} .wr{color:var(--wr)} .bad{color:var(--bad)}

/* ============ TIMER ============ */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#151922f2;
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 12px}
#clock{font:700 2rem/1 ui-monospace,monospace;text-align:center;letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
#clock.run{color:var(--ac)} #clock.done{color:var(--ok)}
#lbl{text-align:center;font-size:.7rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.1em}
.pick{display:flex;gap:6px;margin:8px 0 6px}
.pick button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--tx2);
  border-radius:10px;padding:9px 0;font:600 .8rem system-ui;cursor:pointer}
.pick button.on{border-color:var(--ac);color:var(--tx);background:#1e2a44}
.ctrl{display:flex;gap:6px}
.ctrl button{flex:1;border:none;border-radius:10px;padding:12px 0;
  font:700 .85rem system-ui;cursor:pointer;background:var(--card2);color:var(--tx)}
.ctrl button.go{background:var(--ac);color:#fff}
#wl{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:.72rem;color:var(--tx2);margin-top:8px}
#wl input{accent-color:var(--ac);width:16px;height:16px}

textarea{width:100%;height:120px;background:var(--card2);border:1px solid var(--line);
  color:var(--tx);border-radius:10px;padding:10px;font:.75rem ui-monospace,monospace}
.note{font-size:.75rem;color:var(--tx2);margin:8px 0 16px}
</style>
</head>
<body>

<header>
  <h1 id="ttl">Treino</h1>
  <p class="sub" id="stl"></p>
  <nav>
    <button class="on" data-t="tr">Treino</button>
    <button data-t="hi">Histórico</button>
    <button data-t="ex">Exportar</button>
  </nav>
</header>

<main>
  <section id="tr" class="on">
    <div id="cards"></div>
    <button class="btn pri" onclick="finish()">✓ Encerrar sessão</button>
    <button class="btn sm" id="swap" onclick="swap()"></button>
  </section>

  <section id="hi"></section>

  <section id="ex">
    <div class="card">
      <h3>Backup</h3>
      <p class="note">Copie e guarde. Limpar dados do navegador apaga tudo.</p>
      <textarea id="json" readonly></textarea>
      <button class="btn" onclick="copyJson()">📋 Copiar JSON</button>
    </div>
    <div class="card">
      <h3>Importar</h3>
      <p class="note">Cole um backup válido e confirme. Substitui o estado atual.</p>
      <textarea id="imp" placeholder='{"loads":{...},"log":[...]}'></textarea>
      <button class="btn" onclick="doImport()">⬆ Importar JSON</button>
    </div>
    <button class="btn dan" onclick="wipe()">🗑 Zerar histórico</button>
  </section>
</main>

<!-- ============ TIMER DOCK ============ -->
<div id="dock">
  <div id="clock">3:00</div>
  <div id="lbl">descanso</div>
  <div class="pick">
    <button data-s="90">1:30</button>
    <button data-s="120">2:00</button>
    <button class="on" data-s="180">3:00</button>
    <button data-s="plank">🧘 Prancha</button>
  </div>
  <div class="ctrl">
    <button class="go" id="go" onclick="T.toggle()">▶ Iniciar</button>
    <button onclick="T.reset()">↺ Zerar</button>
  </div>
  <label id="wl"><input type="checkbox" id="wlck" onchange="lock(this.checked)">
    Manter tela acesa durante o treino</label>
</div>

<script>
/* =========================================================
   1. CONFIGURAÇÃO — edite aqui
   ========================================================= */
const BAR = 20;
const PLATES = [25,20,15,10,5,2,1];

const EX = {
  squat:{n:'Agachamento livre',   s:3, inc:4, shared:1},
  bench:{n:'Supino reto',         s:3, inc:2},
  row  :{n:'Remada curvada',      s:3, inc:2},
  ohp  :{n:'Desenvolvimento militar', s:3, inc:2},
  dead :{n:'Levantamento terra',  s:1, inc:4},
  hip  :{n:'Elevação pélvica',    s:2, inc:4, reps:'10-12', goal:10, noProg:1}
};
const A = ['squat','bench','row'];
const B = ['squat','ohp','dead','hip'];

const DEF = {
  loads:{squat:108,bench:74,row:88,ohp:52,dead:174,hip:80},
  fails:{}, floor:{bench:70}, next:'A', log:[]
};
const PLANK = {min:30, max:45};

/* =========================================================
   2. STORE
   ========================================================= */
const KEY='forca.v2';
let S = load();
function load(){
  try{ return {...structuredClone(DEF), ...JSON.parse(localStorage[KEY])}; }
  catch{ return structuredClone(DEF); }
}
function save(){ localStorage[KEY]=JSON.stringify(S); }

/* =========================================================
   3. CÁLCULO
   ========================================================= */
const even = w => Math.max(BAR, Math.round(w/2)*2);
const goal = k => EX[k].goal || 5;

function plates(total){
  let per=(total-BAR)/2;
  if(per<0) return 'carga menor que a barra';
  if(per===0) return 'barra vazia';
  const out=[];
  for(const p of PLATES){ const n=Math.floor(per/p); if(n){ out.push(n>1?`${n}×${p}`:`${p}`); per=+(per-n*p).toFixed(2);} }
  return (per>0.01?'⚠ ':'')+out.join(' + ')+' por lado';
}

function warmup(w){
  return [.28,.5,.7,.85].map((f,i)=>{
    const kg=even(w*f);
    return `${i+1}) ${kg} kg × ${i<2?5:3}`;
  });
}

/* =========================================================
   4. RENDER
   ========================================================= */
const $=s=>document.querySelector(s);
const list = ()=> S.next==='A'?A:B;

function render(){
  const t=S.next, n=S.log.length+1;
  $('#ttl').textContent=`Treino ${t} · sessão ${n}`;
  $('#stl').textContent=`${list().length} exercícios · descanso 2–3 min`;
  $('#swap').textContent=`⇄ Trocar para Treino ${t==='A'?'B':'A'}`;

  $('#cards').innerHTML = list().map(k=>{
    const e=EX[k], w=S.loads[k], f=S.fails[k]||0;
    return `<div class="card">
      <h3>${e.n}${e.shared?' <small style="color:var(--tx2)">↔ A/B</small>':''}</h3>
      <div class="load">${w} <small>kg</small></div>
      <div class="meta">${e.s} × ${e.reps||5} reps${f?` · <span class="wr">1ª falha registrada</span>`:''}</div>
      <div class="plates">🔩 ${plates(w)}</div>
      <div class="warm">Aquecimento:<br>${warmup(w).join('<br>')}</div>
      <div class="reps">${Array.from({length:e.s},(_,i)=>
        `<label>Série ${i+1}<input type="number" inputmode="numeric" min="0"
          id="r_${k}_${i}" placeholder="${e.reps||5}"></label>`).join('')}</div>
    </div>`;
  }).join('');

  renderLog(); $('#json').value=JSON.stringify(S,null,1);
}

function renderLog(){
  if(!S.log.length){ $('#hi').innerHTML='<p class="note">Nenhuma sessão registrada.</p>'; return; }
  $('#hi').innerHTML = S.log.map((s,i)=>`
    <div class="log">
      <b>Treino ${s.t}</b> <span class="d">· ${s.d}</span>
      <ul>${Object.entries(s.ex).map(([k,v])=>
        `<li>${EX[k].n}: ${v.w} kg — ${v.reps.join(' / ')}</li>`).join('')}</ul>
      ${s.msg.map(m=>`<p class="msg ${m[0]==='✔'?'ok':m[0]==='↺'?'wr':'bad'}">${m}</p>`).join('')}
      ${i===0?`<button class="btn sm" onclick="undo()">↶ Desfazer esta sessão</button>`:''}
    </div>`).join('');
}

/* =========================================================
   5. SESSÃO
   ========================================================= */
function finish(){
  const ks=list(), ex={}, msg=[], prev={loads:{...S.loads},fails:{...S.fails}};
  for(const k of ks){
    const e=EX[k], reps=[];
    for(let i=0;i<e.s;i++){ const v=+($(`#r_${k}_${i}`).value||0); reps.push(v); }
    if(reps.every(r=>!r)){ alert(`Preencha as reps de ${e.n}.`); return; }
    ex[k]={w:S.loads[k],reps};
    if(e.noProg){ msg.push(`↺ ${e.n}: mantém ${S.loads[k]} kg (ajuste manual)`); continue; }

    if(reps.every(r=>r>=goal(k))){
      S.fails[k]=0; const nw=S.loads[k]+e.inc;
      msg.push(`✔ ${e.n}: ${S.loads[k]} → ${nw} kg`); S.loads[k]=nw;
    } else if((S.fails[k]||0)===0){
      S.fails[k]=1; msg.push(`↺ ${e.n}: mantém ${S.loads[k]} kg (1ª falha)`);
    } else {
      S.fails[k]=0;
      const fl=S.floor[k]||BAR;
      const nw=Math.max(fl, Math.floor(S.loads[k]*0.9/2)*2);
      msg.push(`↓ ${e.n}: deload ${S.loads[k]} → ${nw} kg${nw===fl?' (piso)':''}`);
      S.loads[k]=nw;
    }
  }
  S.log.unshift({t:S.next,d:new Date().toISOString().slice(0,10),ex,msg,prev});
  S.next = S.next==='A'?'B':'A';
  save(); render();
  alert(`Sessão registrada\n\n${msg.join('\n')}\n\nPróximo: Treino ${S.next}`);
}

function undo(){
  if(!S.log.length||!confirm('Reverter a última sessão?')) return;
  const s=S.log.shift();
  if(s.prev){ S.loads=s.prev.loads; S.fails=s.prev.fails; }
  S.next=s.t; save(); render();
}
function swap(){ S.next = S.next==='A'?'B':'A'; save(); render(); }

/* =========================================================
   6. EXPORTAR
   ========================================================= */
function copyJson(){ navigator.clipboard.writeText($('#json').value).then(()=>alert('JSON copiado.')); }
function doImport(){
  try{
    const d=JSON.parse($('#imp').value);
    if(!d.loads) throw 0;
    if(!confirm('Substituir os dados atuais?')) return;
    S={...structuredClone(DEF),...d}; save(); render(); $('#imp').value='';
    alert('Importado.');
  }catch{ alert('JSON inválido. Nada foi alterado.'); }
}
function wipe(){ if(confirm('Apagar TUDO e voltar às cargas iniciais?')){ localStorage.removeItem(KEY); S=load(); render(); } }

/* =========================================================
   7. TIMER (descanso ↓ / prancha ↑)
   ========================================================= */
const T = {
  mode:'rest', preset:180, t:180, run:false, id:null,

  fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },

  paint(done){
    $('#clock').textContent=this.fmt(this.t);
    $('#clock').className = done?'done':(this.run?'run':'');
    $('#lbl').textContent = this.mode==='plank'
      ? `prancha · meta ${PLANK.min}–${PLANK.max}s` : 'descanso';
    $('#go').textContent = this.run?'⏸ Pausar':'▶ Iniciar';
  },

  set(v){
    this.stop();
    if(v==='plank'){ this.mode='plank'; this.t=0; }
    else{ this.mode='rest'; this.preset=+v; this.t=+v; }
    document.querySelectorAll('.pick button').forEach(b=>b.classList.toggle('on',b.dataset.s===v));
    this.paint();
  },

  toggle(){ this.run ? this.stop() : this.start(); },

  start(){
    this.run=true; audio(); this.paint();
    this.id=setInterval(()=>{
      if(this.mode==='rest'){
        this.t--;
        if(this.t<=0){ this.t=0; this.stop(); alarm(3); this.paint(true);
          setTimeout(()=>{ this.t=this.preset; this.paint(); },2500); return; }
      } else {
        this.t++;
        if(this.t===PLANK.min) alarm(1);
        if(this.t===PLANK.max){ alarm(3); this.stop(); this.paint(true); return; }
      }
      this.paint();
    },1000);
  },

  stop(){ clearInterval(this.id); this.run=false; this.paint(); },
  reset(){ this.stop(); this.t = this.mode==='plank'?0:this.preset; this.paint(); }
};
document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>T.set(b.dataset.s));

/* --- som + vibração --- */
let AC=null;
function audio(){ if(!AC) try{ AC=new (window.AudioContext||webkitAudioContext)(); }catch{} AC?.resume?.(); }
function beep(f=880,ms=140,at=0){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+at;
  o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+ms/1000+.02);
}
function alarm(n){
  for(let i=0;i<n;i++) beep(n===1?660:880,150,i*.25);
  navigator.vibrate?.(n===1?[200]:[200,120,200,120,200]);
}

/* --- wake lock --- */
let WL=null;
async function lock(on){
  try{
    if(on){ WL=await navigator.wakeLock.request('screen');
            WL.onrelease=()=>{ WL=null; $('#wlck').checked=false; }; }
    else{ await WL?.release(); WL=null; }
  }catch{ $('#wlck').checked=false; alert('Este navegador não suporta manter a tela acesa.'); }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && $('#wlck').checked && !WL) lock(true);
});

/* =========================================================
   8. NAV + BOOT
   ========================================================= */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});
render(); T.paint();
</script>
</body>
</html>
